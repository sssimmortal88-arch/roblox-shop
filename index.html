<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MM2 EZ SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>MM2 EZ SHOP</h1>
    <button type="button" class="cart-badge" id="openCartBtn">🛒 <span id="cartBadge">0</span></button>
  </header>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Поиск годли...">
    <select id="categoryFilter">
      <option value="all">Все категории</option>
      <option value="knife">Ножи</option>
      <option value="gun">Оружие</option>
      <option value="pet">Питомцы</option>
    </select>
  </div>

  <main id="catalog" class="catalog"></main>

  <!-- Экран корзины -->
  <div id="cartScreen" class="screen hidden">
    <h2>Корзина</h2>
    
    <!-- Динамический список товаров -->
    <div id="cartItems"></div>

    <!-- Блок Итого -->
    <div class="cart-summary-block">
      <div id="cartCountLabel" class="cart-count-text">В корзине 0 товаров</div>
      <div class="cart-total-title">Итого: <span id="cartTotal">0</span> ₸</div>

      <label for="nickname" style="display:block; margin-bottom:8px; font-weight:600;">Ваш ник в Roblox</label>
      <input type="text" id="nickname" placeholder="Например: xX_Player_Xx" style="width:100%; padding:12px; margin-bottom:15px; border-radius:12px; border:1px solid #282936; background:#181922; color:#fff; box-sizing:border-box;">

      <div class="payment-block" style="text-align:center; margin-bottom:15px;">
        <p style="margin-bottom:8px; color:#a0a0ab;">Переведите сумму на Kaspi по номеру/QR:</p>
        <img src="kaspi-qr.png" alt="Kaspi QR" class="qr-img" style="max-width:150px; border-radius:12px;">
        <p class="requisites" style="font-weight:bold; margin-top:8px;">+7 7XX XXX XX XX (Kaspi Gold)</p>
      </div>

      <button id="submitOrderBtn" class="primary-btn" style="width:100%;">К оформлению ›</button>
      <button id="backToCatalogBtn" class="secondary-btn" style="width:100%; background:transparent; margin-top:8px; border:none; color:#a0a0ab;">← Назад в каталог</button>
    </div>
  </div>

  <!-- Экран статуса заказа -->
  <div id="statusScreen" class="screen hidden">
    <h2>Заказ отправлен ✅</h2>
    <p>Мы проверим оплату и пришлём тебе ссылку/приглашение в приватный сервер, где бот выдаст предметы.</p>
    <p id="orderIdText"></p>
    <button id="checkStatusBtn" class="primary-btn">Проверить статус</button>
    <div id="deliveryLink"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
